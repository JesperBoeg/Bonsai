# Render Blueprint — deploys the Bonsai web app and vision service as containers.
# Docs: https://render.com/docs/blueprint-spec
services:
  # ----- Python vision service (PyTorch / DINOv2) -----
  - type: web
    name: bonsai-vision
    runtime: docker
    plan: standard            # 2 GB RAM. Bump to `pro` (4 GB) if PyTorch OOMs on boot.
    region: oregon
    dockerfilePath: ./services/vision/Dockerfile
    dockerContext: ./services/vision
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: hf-cache
      mountPath: /app/.hf-cache   # HF_HOME — model weights survive deploys/restarts
      sizeGB: 2
    # First boot downloads model weights and embeds the reference catalog (several minutes).

  # ----- Next.js web app -----
  - type: web
    name: bonsai-web
    runtime: docker
    plan: starter             # paid tier required for a persistent disk
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /sign-in
    autoDeploy: true
    disk:
      name: bonsai-data
      mountPath: /app/data    # the on-disk per-user store and photo uploads
      sizeGB: 1
    envVars:
      # WARNING: this Supabase project (epqxygxvvlsobbyhhnke) no longer resolves
      # in DNS — it appears paused or deleted. Restore or recreate it in the
      # Supabase dashboard, then update the URL and anon key below (and re-apply
      # migrations with `npx supabase db push`) before deploying.
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://epqxygxvvlsobbyhhnke.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_REgFRCS_t7Rmf_s0uxx4KA_-KOIDNpf
      # Set after the first deploy to the web service's own https URL.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Set after the vision service is live, to its full https URL (e.g. https://bonsai-vision.onrender.com).
      - key: VISION_SERVICE_URL
        sync: false
      # API keys are entered in the Render dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false            # optional — only needed while BONSAI_IMAGE_PROVIDER=gemini
      - key: BONSAI_IMAGE_PROVIDER
        value: gemini
      - key: BONSAI_DATA_BACKEND
        value: supabase
