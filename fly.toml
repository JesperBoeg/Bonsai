app = 'bonsai-progress'
primary_region = 'ams'

[build]
  dockerfile = 'apps/web/Dockerfile'

[env]
  BONSAI_DATA_BACKEND = 'supabase'
  BONSAI_IMAGE_PROVIDER = 'none'
  NEXT_PUBLIC_SUPABASE_ANON_KEY = 'sb_publishable_REgFRCS_t7Rmf_s0uxx4KA_-KOIDNpf'
  NEXT_PUBLIC_SUPABASE_URL = 'https://epqxygxvvlsobbyhhnke.supabase.co'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.web]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    path = '/sign-in'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
