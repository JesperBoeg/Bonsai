<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5f7a53" />
    <title>Offline — Bonsai</title>
    <style>
      :root {
        --bg: #f5f0e8;
        --ink: #1d2a20;
        --muted: #5e675d;
        --accent: #5f7a53;
        --accent-deep: #2c4a38;
        --sand: #caa46a;
        --line: rgba(29, 42, 32, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(95, 122, 83, 0.24), transparent 34%),
          radial-gradient(circle at bottom right, rgba(202, 164, 106, 0.22), transparent 28%),
          linear-gradient(180deg, #f7f2ea 0%, #efe4d4 100%);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        max-width: 460px;
        padding: 40px 32px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255, 251, 244, 0.78);
        box-shadow: 0 24px 60px rgba(47, 43, 35, 0.12);
      }
      .mark { width: 108px; height: 108px; margin: 0 auto 18px; display: block; }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent-deep);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 14px; font-size: 2.4rem; line-height: 1; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: var(--accent-deep);
        color: #f9f4ea;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #234233; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 512 512" role="img" aria-label="Bonsai">
        <path d="M252 402 C246 352 214 336 226 282 C234 246 252 224 254 194" fill="none" stroke="#2c4a38" stroke-width="24" stroke-linecap="round"/>
        <path d="M230 296 C268 288 314 272 348 254 M226 312 C204 302 176 278 158 252" fill="none" stroke="#2c4a38" stroke-width="15" stroke-linecap="round"/>
        <ellipse cx="252" cy="158" rx="94" ry="48" fill="#2c4a38"/>
        <ellipse cx="150" cy="240" rx="58" ry="30" fill="#2c4a38"/>
        <ellipse cx="360" cy="252" rx="62" ry="32" fill="#5f7a53"/>
        <rect x="168" y="386" width="176" height="18" rx="9" fill="#2c4a38"/>
        <path d="M186 404 L326 404 L310 458 L202 458 Z" fill="#2c4a38"/>
        <rect x="214" y="416" width="84" height="9" rx="4.5" fill="#caa46a"/>
      </svg>
      <p class="eyebrow">Bonsai</p>
      <h1>You are offline</h1>
      <p>
        This page needs a connection, and new captures cannot be saved until you are
        back online. Your trees will be waiting when the network returns.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
