name: CI

# Quality gate only. Deployment is handled by Render: both services in
# render.yaml have autoDeploy enabled, so Render builds and deploys the
# containers on every push to main. This workflow just has to stay green.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      VISION_SERVICE_URL: ${{ secrets.VISION_SERVICE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint:web

      - name: Build web app
        run: npm run build:web

  vision-tests:
    name: Vision service tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install vision service
        shell: bash
        run: |
          python -m pip install --upgrade pip && \
          python -m pip install -e ./services/vision

      - name: Run vision unit tests
        working-directory: services/vision
        shell: bash
        # Pixel encoders keep CI fast and avoid downloading Hugging Face weights.
        env:
          BONSAI_IDENTITY_ENCODER: pixel
          BONSAI_TAXONOMY_ENCODER: pixel
        run: |
          python -m unittest tests/test_catalog_recognition.py && \
          python -m unittest tests/test_open_license_leaf_index.py
