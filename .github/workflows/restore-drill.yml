name: Restore drill

# Proves the nightly backup can come back (docs/GUARDRAILS.md). Manual only:
# run it after the first successful nightly backup, and again whenever the schema
# changes materially. It restores into a throwaway Postgres service container —
# nothing production-facing is touched.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "nightly-backup run to restore (blank = latest successful run)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  drill:
    name: Restore the latest backup into a scratch database
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image, not plain postgres: the dump has vector(768) columns.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          # The runner image ships PostgreSQL 16 ahead of /usr/bin on PATH, and a
          # 16 client cannot restore a 17 dump — so pin 17's bin dir first.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Download the backup artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then
            RUN_ID=$(gh run list --workflow nightly-backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "${RUN_ID:-}" ]; then
            echo "::error::No successful nightly-backup run found. Run that workflow first."
            exit 1
          fi
          echo "Restoring the backup from run $RUN_ID."
          # The artifacts API returns the odd 503; a drill that fails for that
          # reason teaches nothing, so retry before giving up.
          for attempt in 1 2 3 4 5; do
            if gh run download "$RUN_ID" --dir restore; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not download the backup artifact after 5 attempts."
              exit 1
            fi
            echo "download attempt $attempt failed; retrying in 20s"
            rm -rf restore
            sleep 20
          done
          find restore -maxdepth 3 -name '*.dump' -o -maxdepth 3 -name manifest.json | sort

      - name: Prepare the scratch database
        env:
          PGPASSWORD: drill
        run: |
          set -euo pipefail
          # Two things the dump needs from a vanilla Postgres:
          #   - pgvector, because the photo tables declare vector(768) columns;
          #   - Supabase's roles, because RLS policies name them ("to authenticated")
          #     and policies are schema, not privileges — so pg_dump keeps them even
          #     with --no-privileges, and every policy fails without the role.
          # Stub roles are enough: the drill is about the data coming back, not about
          # reproducing Supabase's permission model. Re-running is safe; psql without
          # ON_ERROR_STOP reports "already exists" and carries on.
          cat > roles.sql <<'SQL'
          create extension if not exists vector;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create role authenticator noinherit nologin;
          create role supabase_admin nologin;
          create role supabase_auth_admin nologin;
          create role supabase_storage_admin nologin;
          create role dashboard_user nologin;
          SQL
          sed -i 's/^          //' roles.sql
          psql -h localhost -U postgres -d drill -f roles.sql
          psql -h localhost -U postgres -d drill -tAc "select count(*) from pg_roles where rolname in ('anon','authenticated','service_role')"

      - name: Restore and verify
        env:
          RESTORE_TARGET_DB_URL: postgres://postgres:drill@localhost:5432/drill
        run: |
          set -euo pipefail
          dump=$(find restore -name '*.dump' | head -n1)
          storage=$(dirname "$(find restore -name manifest.json | head -n1)")
          node scripts/restore-drill.mjs --dump "$dump" --storage "$storage"
